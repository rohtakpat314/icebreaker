<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Sign in to Freezer Watch." />
  <title>Sign in · Freezer Watch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="gate">
  <main class="gate-card">
    <img src="/images.jpg" alt="The Wisconsin State Capitol at night in heavy snow" />
    <div class="gate-copy">
      <p class="eyebrow">UW–Madison · February 2019</p>
      <h1>Freezer Watch</h1>
      <p class="fact">Sign in to replay the freeze, hour by hour. Each account sees a different slice of campus.</p>
      <form id="login">
        <label>User
          <input name="username" autocomplete="username" required placeholder="officer" />
        </label>
        <label>Password
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <p id="error" class="form-error" hidden></p>
        <button class="primary" type="submit">Sign in</button>
      </form>
      <div class="demos">
        <p>Demo accounts</p>
        <button type="button" data-user="officer" data-pass="capitol-2019">Facilities Officer<br />officer · capitol-2019</button>
        <button type="button" data-user="labmgr-chemistry" data-pass="babcock-2019">Chemistry Lab Manager<br />labmgr-chemistry · babcock-2019</button>
        <button type="button" data-user="viewer" data-pass="lakeshore">Viewer<br />viewer · lakeshore</button>
      </div>
    </div>
  </main>
  <script src="/login.js"></script>
</body>
</html>
